{% extends "layout.html" %}

{% block title %}Change password — Neighborhood Library{% endblock %}

{% block extra_css %}
<style>
    .change-password-form { max-width: 24rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .form-group input { width: 100%; padding: 0.5rem; }
    .error { color: #c53030; margin-bottom: 0.5rem; }
    .success { color: #276749; margin-bottom: 0.5rem; }
    .form-actions { margin-top: 1.5rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; border: none; font-size: 1rem; }
    .btn-primary { background: #2c5282; color: #fff; }
    .btn-primary:hover { background: #2a4365; }
    .btn-cancel { background: #e2e8f0; color: #1a1a1a; text-decoration: none; display: inline-block; margin-left: 0.5rem; }
</style>
{% endblock %}

{% block content %}
<h2>Change password</h2>
{% if success %}
<p class="success">Your password has been updated.</p>
{% endif %}
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ request.url_for('change_password_submit') }}" class="change-password-form">
    <div class="form-group">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" required autofocus>
    </div>
    <div class="form-group">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" required minlength="1">
    </div>
    <div class="form-group">
        <label for="new_password_confirm">Confirm new password</label>
        <input id="new_password_confirm" name="new_password_confirm" type="password" required minlength="1">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update password</button>
        <a href="{{ request.url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </div>
</form>
{% endblock %}
