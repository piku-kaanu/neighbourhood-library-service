{% extends "layout.html" %}

{% block title %}Login — Neighborhood Library{% endblock %}

{% block extra_css %}
<style>
    .login-form { max-width: 20rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .form-group input { width: 100%; padding: 0.5rem; }
    .error { color: #c53030; margin-bottom: 0.5rem; }
    .btn-login { padding: 0.5rem 1rem; background: #2c5282; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
</style>
{% endblock %}

{% block content %}
<h2>Login</h2>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ request.url_for('login_submit') }}" class="login-form">
    <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
    </div>
    <button type="submit" class="btn-login">Log in</button>
</form>
{% endblock %}
